services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: neurocache-postgres
    environment:
      POSTGRES_USER: neurocache
      POSTGRES_PASSWORD: neurocache_dev_pw
      POSTGRES_DB: neurocache
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurocache"]
      interval: 5s
      retries: 10

  redis:
    image: redis/redis-stack:latest
    container_name: neurocache-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
